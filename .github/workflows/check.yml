name: App health check

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run health check
        run: node check.js
        env:
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_FROM: ${{ secrets.SOLAPI_FROM }}
          SOLAPI_TO: ${{ secrets.SOLAPI_TO }}

      - name: Commit results
        run: |
          git config user.name "app-monitor"
          git config user.email "app-monitor@users.noreply.github.com"
          git add status.json history.json
          git commit -m "check: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "no changes"
          git push
